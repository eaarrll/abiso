[project]
name = "barangay-alert-relay"
version = "0.1.0"
description = "Abiso: last-mile disaster alert relay for Philippine barangays — PAGASA CAP ingest, barangay downscaling, multi-channel delivery"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "huggingface_hub>=0.30",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = [
    "pipeline",
    "pipeline.dataprep",
    "pipeline.ingest",
    "pipeline.downscale",
    "pipeline.compose",
    "pipeline.deliver",
]
